<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e1b" />
      <stop offset="100%" stop-color="#121210" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e0a0" />
      <stop offset="50%" stop-color="#c5a059" />
      <stop offset="100%" stop-color="#8f6c26" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)" />

  <!-- Outer Ring -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="url(#gold)" stroke-width="4" stroke-opacity="0.4" />
  <circle cx="256" cy="256" r="204" fill="none" stroke="url(#gold)" stroke-width="2" stroke-dasharray="6 8" stroke-opacity="0.6" />

  <!-- Monogram G -->
  <g filter="url(#glow)">
    <!-- Stylized curved G -->
    <path d="M 340 180 C 310 140, 210 135, 170 190 C 130 245, 135 320, 180 365 C 230 410, 320 405, 355 350 C 365 335, 365 310, 365 300 L 260 300 L 260 265 L 395 265 C 398 290, 395 350, 345 400 C 285 455, 170 445, 120 380 C 70 310, 75 210, 140 145 C 205 85, 325 85, 385 145 Z" fill="url(#gold)" />
    <!-- Decorative star / sparkle -->
    <path d="M 370 130 L 375 145 L 390 150 L 375 155 L 370 170 L 365 155 L 350 150 L 365 145 Z" fill="#fdf3d0" />
  </g>

  <!-- Subtitle -->
  <text x="256" y="450" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="28" font-weight="600" letter-spacing="8" fill="url(#gold)" text-anchor="middle">GLADYSA</text>
</svg>
