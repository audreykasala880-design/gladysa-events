services:
  - type: web
    name: gladysa-signature-events-backend
    env: node
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_PATH
        value: data/gladysa.sqlite
      - key: ADMIN_API_KEY
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
